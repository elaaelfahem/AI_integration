services:
  postgres:
    image: postgres:16-alpine
    container_name: dme-application-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dme_integration
      POSTGRES_USER: dme_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["dme_application_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dme_local -d dme_local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dme_application_data:
