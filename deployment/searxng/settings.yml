use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - mwmbl

general:
  instance_name: "B2B Search"
  enable_metrics: false

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  image_proxy: false

valkey:
  url: false

# Upstream engines regularly need more than the 3 s default from this network.
outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0

# Restrict this local demo to the engines verified reachable on this network.
# Expand only after probing additional engines; do not bypass upstream blocks.
engines:
  - name: duckduckgo
    disabled: false
  - name: mwmbl
    disabled: false
