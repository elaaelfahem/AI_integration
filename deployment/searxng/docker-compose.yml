services:
  searxng:
    image: searxng/searxng:latest
    container_name: b2b-searxng
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_BASE_URL: "http://localhost:8081/"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - flowise_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  flowise_network:
    external: true
    name: docker_default
