<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      @media only screen and (max-width: 640px) {
        .page-pad {
          padding: 36px 16px 44px !important;
        }

        .logo {
          width: 72px !important;
          height: 72px !important;
        }

        .title {
          font-size: 26px !important;
        }

        .copy {
          font-size: 16px !important;
        }

        .button {
          display: block !important;
          padding: 16px 20px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: #ffffff">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="border-collapse: collapse; background: #ffffff"
    >
      <tr>
        <td class="page-pad" align="center" style="padding: 56px 24px 64px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 640px; border-collapse: collapse"
          >
            <tr>
              <td align="center">
                <img
                  class="logo"
                  src="{{logoUrl}}"
                  width="88"
                  height="88"
                  alt="Orange"
                  style="
                    display: block;
                    width: 88px;
                    height: 88px;
                    border: 0;
                    outline: none;
                    text-decoration: none;
                  "
                />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 56px 0 40px">
                <h1
                  class="title"
                  style="
                    margin: 0;
                    color: #000000;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 32px;
                    line-height: 1.2;
                    font-weight: 700;
                    letter-spacing: -0.5px;
                  "
                >
                  {{title}}
                </h1>
              </td>
            </tr>
            <tr>
              <td align="left">{{content}}</td>
            </tr>
            <tr>
              <td align="left" style="padding-top: 48px">
                <p
                  class="copy"
                  style="
                    margin: 0;
                    color: #333333;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 18px;
                    line-height: 1.5;
                  "
                >
                  {{signOff}}<br />
                  <span style="color: #ff7900; font-weight: 700">{{team}}</span>
                </p>
              </td>
            </tr>
            <tr>
              <td align="left" style="padding-top: 40px">
                <p
                  style="
                    margin: 0;
                    color: #8a8a8a;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  {{footer}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
