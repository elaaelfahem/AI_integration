<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="border-collapse: collapse"
>
  <tr>
    <td align="center" style="padding: 32px 0 8px">
      <a
        class="button"
        href="{{url}}"
        style="
          display: inline-block;
          padding: 18px 40px;
          background: #ff7900;
          color: #ffffff;
          font-family: Arial, Helvetica, sans-serif;
          font-size: 18px;
          line-height: 1.2;
          font-weight: 700;
          text-align: center;
          text-decoration: none;
        "
      >
        {{label}}
      </a>
    </td>
  </tr>
</table>
