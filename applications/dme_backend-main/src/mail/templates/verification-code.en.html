<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      @media only screen and (max-width: 640px) {
        .page-pad {
          padding: 40px 16px 44px !important;
        }

        .content {
          max-width: 100% !important;
        }

        .logo {
          width: 76px !important;
          height: 76px !important;
        }

        .title-wrap {
          padding-top: 52px !important;
        }

        .title {
          font-size: 28px !important;
          line-height: 1.18 !important;
          letter-spacing: -0.5px !important;
        }

        .intro-wrap {
          padding-top: 28px !important;
        }

        .copy {
          font-size: 17px !important;
          line-height: 1.45 !important;
        }

        .code-wrap {
          padding-top: 34px !important;
        }

        .code-cell {
          padding: 0 3px !important;
        }

        .code-box {
          width: 42px !important;
          height: 48px !important;
          border-radius: 5px !important;
          font-size: 24px !important;
          line-height: 48px !important;
        }

        .expiry-wrap {
          padding-top: 32px !important;
        }

        .signature-wrap {
          padding-top: 42px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: #ffffff">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="border-collapse: collapse; background: #ffffff"
    >
      <tr>
        <td class="page-pad" align="center" style="padding: 56px 24px 58px">
          <table
            class="content"
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 640px; border-collapse: collapse"
          >
            <tr>
              <td align="center">
                <img
                  class="logo"
                  src="{{logoUrl}}"
                  width="96"
                  height="96"
                  alt="Orange"
                  style="
                    display: block;
                    width: 96px;
                    height: 96px;
                    border: 0;
                    outline: none;
                    text-decoration: none;
                  "
                />
              </td>
            </tr>
            <tr>
              <td class="title-wrap" align="center" style="padding-top: 72px">
                <h1
                  class="title"
                  style="
                    margin: 0;
                    color: #000000;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 34px;
                    line-height: 1.18;
                    font-weight: 700;
                    letter-spacing: -0.7px;
                  "
                >
                  {{title}}
                </h1>
              </td>
            </tr>
            <tr>
              <td class="intro-wrap" align="center" style="padding-top: 42px">
                <p
                  class="copy"
                  style="
                    margin: 0;
                    max-width: 640px;
                    color: #333333;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 19px;
                    line-height: 1.5;
                    font-weight: 400;
                    text-align: center;
                  "
                >
                  {{intro}}<br />
                  This code expires soon.
                </p>
              </td>
            </tr>
            <tr>
              <td class="code-wrap" align="center" style="padding-top: 42px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="border-collapse: collapse"
                >
                  <tr>
                    {{codeBoxes}}
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="expiry-wrap" align="center" style="padding-top: 42px">
                <p
                  class="copy"
                  style="
                    margin: 0;
                    color: #333333;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 19px;
                    line-height: 1.5;
                    font-weight: 400;
                    text-align: center;
                  "
                >
                  This code expires in {{expiresInMinutes}} minutes.<br />
                  If you did not ask for this code, you can simply ignore this
                  email.
                </p>
              </td>
            </tr>
            <tr>
              <td class="signature-wrap" align="left" style="padding-top: 54px">
                <p
                  class="copy"
                  style="
                    margin: 0;
                    color: #333333;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 19px;
                    line-height: 1.5;
                    font-weight: 400;
                  "
                >
                  Best regards,<br />
                  <span style="color: #ff7900; font-weight: 700"
                    >The Orange DME team.</span
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
